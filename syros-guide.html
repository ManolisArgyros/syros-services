    var TOPICS={
      beaches:{image:"topic-beaches",el:["Θάλασσα","Παραλίες & κολύμπι στη Σύρο","Από ήρεμους κολπίσκους έως αμμώδεις ακτές, βρείτε τη θάλασσα που σας ταιριάζει.",["Γαλησσάς και Κίνι για μια πλήρη ημέρα δίπλα στο κύμα.","Αγκαθωπές, Φοίνικας, Βάρη και Αζόλιμνος για επιλογές.","Απογευματινό μπάνιο και φαγητό σε κοντινό οικισμό."]],en:["Sea","Beaches & swimming in Syros","From quiet coves to sandy shores, find the sea that feels right for you.",["Galissas and Kini for a complete day by the sea.","Agathopes, Finikas, Vari and Azolimnos for more choice.","Pair an afternoon swim with dinner nearby."]],fr:["Mer","Plages & baignade à Syros","Des criques tranquilles aux plages de sable, trouvez la mer qui vous ressemble.",["Galissas et Kini pour une journée complète au bord de la mer.","Agathopes, Finikas, Vari et Azolimnos pour varier les plaisirs.","Associez une baignade à un dîner à proximité."]]},
      food:{image:"topic-food",el:["Γεύσεις","Φαγητό στη Σύρο","Τοπικά προϊόντα, γλυκά και τραπέζια που αξίζουν χρόνο και καλή παρέα.",["Δοκιμάστε λουκούμια, χαλβαδόπιτα, λούζα και τοπικά τυριά.","Ρωτήστε για πιάτα ημέρας και εποχικά υλικά.","Πάρτε μαζί σας προϊόντα από μικρά παντοπωλεία."]],en:["Flavours","Food in Syros","Local products, sweets and tables worth lingering over with good company.",["Try loukoumi, halvadopita, louza and local cheese.","Ask about daily dishes and seasonal ingredients.","Take home products from small local delicatessens."]],fr:["Saveurs","Manger à Syros","Produits locaux, douceurs et bonnes tables qui méritent du temps et de la compagnie.",["Goûtez les loukoums, la halvadopita, la louza et les fromages locaux.","Demandez les plats du jour et les produits de saison.","Rapportez des produits de petites épiceries locales."]]},
      "sea-activities":{image:"topic-sea-activities",el:["Εξερεύνηση","Θαλάσσιες δραστηριότητες","Δείτε το νησί από το νερό και δώστε στις διακοπές σας μια πιο περιπετειώδη πλευρά.",["Κολύμπι, SUP, kayak ή βόλτα με σκάφος.","Επιλέξτε δραστηριότητα ανάλογη της εμπειρίας σας.","Ενημερωθείτε για εξοπλισμό και καιρό πριν ξεκινήσετε."]],en:["Explore","Sea activities","See the island from the water and add a more adventurous side to your holiday.",["Swimming, SUP, kayaking or a boat trip.","Choose an activity that matches your experience.","Ask about equipment and conditions before you begin."]],fr:["Explorer","Activités nautiques","Découvrez l’île depuis la mer et donnez une note plus aventureuse à vos vacances.",["Baignade, SUP, kayak ou sortie en bateau.","Choisissez une activité adaptée à votre expérience.","Renseignez-vous sur l’équipement et la météo avant de commencer."]]},
      kids:{image:"topic-kids",el:["Οικογένεια","Σύρος για παιδιά","Μικρές αποστάσεις, εύκολες βόλτες και ημέρες που μπορούν να απολαύσουν όλοι.",["Διαλέξτε παραλίες με εύκολη πρόσβαση και σκιά.","Έχετε μαζί νερό, σνακ και δεύτερα ρούχα.","Συνδυάστε βόλτα στην πόλη με παγωτό ή γλυκό."]],en:["Family","Syros for children","Short distances, easy walks and days everyone can enjoy.",["Choose beaches with easy access and shade.","Bring water, snacks and a change of clothes.","Pair a town walk with ice cream or a sweet treat."]],fr:["Famille","Syros avec les enfants","De petites distances, des promenades faciles et des journées pour toute la famille.",["Choisissez des plages faciles d’accès et ombragées.","Prévoyez de l’eau, des collations et des vêtements de rechange.","Associez une promenade en ville à une glace ou une douceur."]]},
      nightlife:{image:"topic-nightlife",el:["Μετά τη δύση","Βράδυ στη Σύρο","Όταν πέφτει ο ήλιος, η Σύρος αλλάζει ρυθμό χωρίς να χάνει τη φινέτσα της.",["Περπατήστε στην πλατεία Μιαούλη και στην προκυμαία.","Επιλέξτε ένα καλό δείπνο ή ένα χαλαρό ποτό.","Ελέγξτε το πρόγραμμα για θέατρο και μουσική."]],en:["After sunset","Evening in Syros","When the sun goes down, Syros changes pace without losing its elegance.",["Walk around Miaouli Square and the waterfront.","Choose a good dinner or a relaxed drink.","Check the calendar for theatre and music."]],fr:["Après le coucher du soleil","Soirée à Syros","Quand le soleil se couche, Syros change de rythme sans perdre son élégance.",["Promenez-vous sur la place Miaouli et le long du port.","Choisissez un bon dîner ou un verre tranquille.","Consultez le programme du théâtre et de la musique."]]},
      "art-culture":{image:"topic-art-culture",el:["Πολιτισμός","Τέχνη & πολιτισμός","Θέατρο, μουσική, εκθέσεις και η δημιουργική ψυχή της Σύρου.",["Δείτε το Θέατρο Απόλλων και τα νεοκλασικά της πόλης.","Αναζητήστε εκθέσεις, συναυλίες και εκδηλώσεις.","Συνδυάστε έναν χώρο πολιτισμού με βόλτα στα στενά."]],en:["Culture","Art & culture","Theatre, music, exhibitions and the creative soul of Syros.",["See the Apollon Theatre and neoclassical buildings.","Look for exhibitions, concerts and seasonal events.","Pair a cultural stop with a walk through the lanes."]],fr:["Culture","Art & culture","Théâtre, musique, expositions et l’âme créative de Syros.",["Découvrez le théâtre Apollon et les bâtiments néoclassiques.","Recherchez les expositions, concerts et événements.","Associez une visite culturelle à une promenade dans les ruelles."]]},

      museums:{image:"topic-museums",el:["Ιστορία","Μουσεία & ιστορίες της Σύρου","Μικρές στάσεις που εξηγούν πώς ένα νησί έγινε τόσο ξεχωριστό.",["Αναζητήστε ιστορίες για την Ερμούπολη και το λιμάνι.","Δείτε εκθέματα καθημερινής ζωής και τοπικής βιομηχανίας.","Ελέγξτε ημέρες και ώρες λειτουργίας πριν την επίσκεψη."]],en:["History","Museums & stories of Syros","Small stops that explain how one island became so distinctive.",["Look for stories of Ermoupolis and the harbour.","See displays of everyday life and local industry.","Check opening days and hours before visiting."]],fr:["Histoire","Musées & histoires de Syros","De petites étapes qui expliquent comment une île est devenue si singulière.",["Recherchez les histoires d’Ermoupolis et du port.","Découvrez des objets du quotidien et de l’industrie locale.","Vérifiez les jours et horaires d’ouverture avant la visite."]]},
      villages:{image:"topic-villages",el:["Ενδοχώρα","Άνω Σύρος & χωριά","Στενά, θέα, μικρές πλατείες και ένας πιο αργός ρυθμός για να ανακαλύψετε.",["Περπατήστε στα στενά της Άνω Σύρου χωρίς βιασύνη.","Συνδυάστε Κίνι, Γαλησσά, Φοίνικα ή Ποσειδωνία.","Οργανώστε μία πλευρά του νησιού ανά ημέρα."]],en:["Inland","Ano Syros & villages","Narrow lanes, views, small squares and a slower rhythm to discover.",["Walk the lanes of Ano Syros without rushing.","Combine Kini, Galissas, Finikas or Poseidonia.","Plan one side of the island per day."]],fr:["Intérieur de l’île","Ano Syros & villages","Ruelles, vues, petites places et un rythme plus lent à découvrir.",["Parcourez les ruelles d’Ano Syros sans vous presser.","Combinez Kini, Galissas, Finikas ou Poseidonia.","Prévoyez un côté de l’île par jour."]]},
      walks:{image:"topic-walks",el:["Φύση","Διαδρομές & πεζοπορία στη Σύρο","Θέα στο Αιγαίο, παλιά μονοπάτια και βόλτες με τον δικό σας ρυθμό.",["Ξεκινήστε νωρίς ή αργά για να αποφύγετε τη ζέστη.","Έχετε κλειστά παπούτσια, νερό και καπέλο.","Ενημερωθείτε τοπικά για τη διαδρομή και τις συνθήκες."]],en:["Nature","Routes & hiking in Syros","Aegean views, old paths and walks at your own pace.",["Start early or late to avoid the heat.","Wear closed shoes and bring water and a hat.","Ask locally about the route and current conditions."]],fr:["Nature","Itinéraires & randonnée à Syros","Vues sur l’Égée, anciens sentiers et balades à votre rythme.",["Partez tôt ou tard pour éviter la chaleur.","Portez des chaussures fermées et emportez de l’eau et un chapeau.","Renseignez-vous localement sur l’itinéraire et les conditions."]]}
